name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check src/app.js
          node --check src/controllers/authController.js
          node --check src/controllers/userController.js
          node --check src/middleware/authMiddleware.js
          node --check src/middleware/errorMiddleware.js
          node --check src/middleware/validate.js
          node --check src/models/User.js
          node --check src/routes/authRoutes.js
          node --check src/routes/userRoutes.js
          node --check src/utils/email.js
          node --check src/utils/tokens.js
          node --check src/validations/authValidation.js
